<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="dashboard-header">
    <div class="header-container">
      <div class="logo-group">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <h2>TaskFlow</h2>
      </div>

      <div class="user-controls">
        <div class="user-profile">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-info">
            <span class="user-name" id="user-name">Loading...</span>
            <span class="user-email" id="user-email">user@example.com</span>
          </div>
        </div>

        <button class="btn btn-secondary btn-sm" onclick="handleLogout()" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">

    <!-- Statistics Overview Grid -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon-wrapper stat-icon-total">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="stat-details">
          <span class="stat-label">Total Tasks</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrapper stat-icon-completed">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="stat-details">
          <span class="stat-label">Completed</span>
          <span class="stat-value" id="stat-completed">0</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrapper stat-icon-pending">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="stat-details">
          <span class="stat-label">Pending</span>
          <span class="stat-value" id="stat-pending">0</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrapper stat-icon-overdue">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="stat-details">
          <span class="stat-label">Overdue</span>
          <span class="stat-value" id="stat-overdue">0</span>
        </div>
      </div>
    </section>

    <!-- Completed Task Counter & Progress Bar Widget -->
    <section class="progress-card">
      <div class="progress-header">
        <h3>Task Progress</h3>
        <span class="progress-rate" id="progress-percentage">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar-fill"></div>
      </div>
      <div class="progress-footer">
        <span id="progress-count-text">0 of 0 tasks completed</span>
      </div>
    </section>

    <!-- Action & Filter Toolbar -->
    <section class="action-toolbar">
      <div class="search-filter-group">
        <!-- Search Input -->
        <div class="search-box">
          <span class="search-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="task-search-input" placeholder="Search tasks by keyword..." oninput="handleSearch(this.value)" />
        </div>

        <!-- Filter Tabs -->
        <div class="filter-pills">
          <button class="filter-pill active" onclick="setStatusFilter('all', this)">All</button>
          <button class="filter-pill" onclick="setStatusFilter('pending', this)">Pending</button>
          <button class="filter-pill" onclick="setStatusFilter('completed', this)">Completed</button>
          <button class="filter-pill" onclick="setStatusFilter('overdue', this)">Overdue</button>
        </div>

        <!-- Priority Filter -->
        <select class="select-filter" id="priority-filter" onchange="handlePriorityFilter(this.value)">
          <option value="">All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>

        <!-- Sorting -->
        <select class="select-filter" id="sort-filter" onchange="handleSortChange(this.value)">
          <option value="createdAt_desc">Newest First</option>
          <option value="createdAt_asc">Oldest First</option>
          <option value="deadline_asc">Due Date (Earliest)</option>
          <option value="deadline_desc">Due Date (Latest)</option>
          <option value="priority_desc">Priority (High to Low)</option>
        </select>
      </div>

      <!-- Add Task Button -->
      <button class="btn btn-primary" onclick="openCreateTaskModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Task</span>
      </button>
    </section>

    <!-- Task Cards Container -->
    <section class="tasks-grid" id="tasks-container">
      <!-- Dynamically injected task cards -->
    </section>

  </main>

  <!-- Create / Edit Task Modal Dialog -->
  <div class="modal-backdrop" id="task-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Create New Task</h3>
        <button class="close-modal" onclick="closeTaskModal()" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="task-form" onsubmit="handleTaskFormSubmit(event)">
        <div class="modal-body">
          <input type="hidden" id="task-id" />

          <div class="form-group">
            <label for="task-title-input">Task Title *</label>
            <input type="text" id="task-title-input" class="form-control no-icon" placeholder="e.g. Finish quarterly project report" required maxlength="120" />
          </div>

          <div class="form-group">
            <label for="task-desc-input">Description</label>
            <textarea id="task-desc-input" class="form-control no-icon" rows="3" placeholder="Provide extra details or action items..." maxlength="1000"></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label for="task-deadline-input">Deadline Date</label>
              <input type="date" id="task-deadline-input" class="form-control no-icon" />
            </div>

            <div class="form-group">
              <label for="task-priority-input">Priority</label>
              <select id="task-priority-input" class="form-control no-icon">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="form-group" id="status-group" style="display: none;">
            <label for="task-status-input">Status</label>
            <select id="task-status-input" class="form-control no-icon">
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-task">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-backdrop" id="delete-modal">
    <div class="modal-card" style="max-width: 420px;">
      <div class="modal-header">
        <h3>Delete Task</h3>
        <button class="close-modal" onclick="closeDeleteModal()" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-muted); font-size: 0.95rem;">
          Are you sure you want to permanently delete this task? This action cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-btn" onclick="confirmDeleteTask()">Delete Task</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
